<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction C — Contemporary creative studio</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1ECDF;--ink:#16111F;--cobalt:#1F35FF;--red:#F2411B;--yellow:#E4FF3A}
*{box-sizing:border-box}
body{margin:0;background:var(--cobalt);color:var(--paper);font-family:"Instrument Sans",sans-serif;overflow:hidden}
.mono{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.hero{height:100vh;display:grid;grid-template-columns:46% 54%}
.left{padding:28px 40px 44px;display:flex;flex-direction:column;justify-content:space-between}
h1{font-family:"Archivo";font-weight:900;font-stretch:125%;font-size:5.6vw;line-height:.9;letter-spacing:-.04em;text-transform:uppercase;margin:0}
h1 em{font-style:normal;color:var(--yellow)}
.left p{font-size:20px;line-height:1.4;max-width:30ch;margin:28px 0 0}
.cta{display:flex;gap:28px;margin-top:34px;font-weight:600;font-size:18px}
.cta a{border-bottom:2px solid currentColor;padding-bottom:4px}
.right{background:var(--red);position:relative;overflow:hidden}
.right img{position:absolute;box-shadow:0 30px 60px -20px rgba(22,17,31,.6)}
.a{width:92%;left:14%;top:9%}
.b{width:62%;left:-6%;top:47%}
.c{width:22%;right:6%;top:36%}
.tag{position:absolute;left:24px;bottom:20px;color:var(--ink)}
</style>
</head>
<body>
<section class="hero">
  <div class="left">
    <div style="display:flex;justify-content:space-between"><b>Sheroz Khan</b><span class="mono">Dubai · taking on new projects</span></div>
    <div>
      <h1>Software<br>for businesses<br>that <em>run</em><br>on it.</h1>
      <p>Full-stack developer, AI engineer and creative technologist. I build the product and the system behind it.</p>
      <div class="cta"><a>Selected work →</a><a>Start a project →</a></div>
    </div>
    <span class="mono">Scroll</span>
  </div>
  <div class="right">
    <img class="a" src="../../public/shots/ffl-storefront.webp" alt="">
    <img class="b" src="../../public/shots/pg-owner-dashboard.webp" alt="">
    <img class="c" src="../../public/shots/ffl-mobile.webp" alt="">
    <span class="mono tag">Real screens: Food For Less (live), PG India (in development)</span>
  </div>
</section>
</body>
</html>
