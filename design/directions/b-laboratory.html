<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction B — Digital art laboratory</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--plum:#1D0F2B;--paper:#F1ECDF;--cobalt:#2B45FF;--red:#F2411B;--yellow:#E4FF3A}
*{box-sizing:border-box}
body{margin:0;background:var(--plum);color:var(--paper);font-family:"Instrument Sans",sans-serif;overflow:hidden}
.mono{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
canvas{position:absolute;inset:0;width:100vw;height:100vh}
nav{position:absolute;top:26px;left:40px;right:40px;display:flex;justify-content:space-between;z-index:5}
nav a{margin-left:28px;font-weight:500}
h1{position:absolute;left:40px;bottom:120px;margin:0;font-family:"Bricolage Grotesque";font-size:11.5vw;line-height:.84;letter-spacing:-.045em;z-index:3;mix-blend-mode:difference}
h1 i{font-style:normal;display:inline-block}
.panel{position:absolute;right:40px;top:110px;width:250px;border:1px solid rgba(241,236,223,.4);padding:16px;z-index:4;background:rgba(29,15,43,.7)}
.panel div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(241,236,223,.18)}
.foot{position:absolute;left:40px;right:40px;bottom:40px;display:flex;justify-content:space-between;align-items:end;z-index:4}
.foot p{max-width:420px;font-size:19px;line-height:1.35;margin:0}
.foot a{color:var(--plum);background:var(--yellow);padding:16px 22px;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav><b>Sheroz Khan</b><span><a>Work</a><a>Services</a><a>About</a><a>Lab</a><a>Contact</a></span></nav>
<div class="panel mono"><div><span>Specimen</span><span>flow field</span></div><div><span>Particles</span><span>1,400</span></div><div><span>Order</span><span id="o">0.00</span></div><div><span>Input</span><span>your cursor</span></div></div>
<h1 id="h">IDEAS BECOME<br>SYSTEMS</h1>
<div class="foot"><p>Sheroz Khan. Full-stack developer, AI engineer and creative technologist in Dubai. Move the pointer: noise turns into structure.</p><a>Enter the lab ↘</a></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,m={x:.5,y:.5};
function size(){W=c.width=innerWidth;H=c.height=innerHeight}size();onresize=size;
onpointermove=e=>{m.x=e.clientX/W;m.y=e.clientY/H};
const P=Array.from({length:1400},(_,i)=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,c:i%9==0?'#E4FF3A':i%7==0?'#F2411B':i%3==0?'#2B45FF':'#F1ECDF'}));
x.fillStyle='#1D0F2B';x.fillRect(0,0,W,H);
// Letters whose weight and width follow the pointer.
const h=document.getElementById('h');h.innerHTML=h.innerHTML.replace(/[A-Z]/g,s=>'<i>'+s+'</i>');const L=[...h.querySelectorAll('i')];
function frame(t){
  const order=m.x; document.getElementById('o').textContent=order.toFixed(2);
  x.fillStyle='rgba(29,15,43,.06)';x.fillRect(0,0,W,H);
  for(const p of P){
    const n=Math.sin(p.x*.004+t*.0002)*Math.cos(p.y*.005-t*.00015)*Math.PI*2;
    const grid=Math.round(n/(Math.PI/2))*(Math.PI/2);       // snapped to right angles = structure
    const a=n*(1-order)+grid*order;
    const px=p.x,py=p.y;p.x+=Math.cos(a)*1.6;p.y+=Math.sin(a)*1.6;
    x.strokeStyle=p.c;x.globalAlpha=.55;x.lineWidth=1.1;x.beginPath();x.moveTo(px,py);x.lineTo(p.x,p.y);x.stroke();
    if(p.x<0||p.x>W||p.y<0||p.y>H||Math.random()<.004){p.x=Math.random()*W;p.y=Math.random()*H}
  }
  x.globalAlpha=1;
  L.forEach((el,i)=>{const d=Math.abs(i/L.length-m.x);el.style.fontVariationSettings=`"wght" ${800-d*900|0}, "wdth" ${100-d*40}`});
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
