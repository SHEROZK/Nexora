<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction A — Experimental editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1ECDF;--ink:#16111F;--cobalt:#1F35FF;--red:#F2411B;--yellow:#E4FF3A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",sans-serif;overflow-x:hidden}
.mono{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.hero{height:100vh;position:relative;overflow:hidden}
nav{position:absolute;top:26px;left:40px;right:40px;display:flex;justify-content:space-between;z-index:5}
nav a{color:inherit;text-decoration:none;margin-left:28px;font-weight:500}
.giant{font-family:"Bricolage Grotesque";font-weight:800;font-stretch:75%;font-size:35.5vw;line-height:.72;letter-spacing:-.055em;color:var(--cobalt);position:absolute;left:-1.6vw;top:9vh;white-space:nowrap;margin:0}
.giant span{display:block}
.giant .two{margin-left:21vw;color:var(--ink)}
.slab{position:absolute;right:7vw;top:17vh;width:34vw;aspect-ratio:1424/900;background:var(--red);transform:rotate(-5deg);z-index:2}
.slab img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translate(-22px,-22px);border:2px solid var(--ink)}
.phone{position:absolute;right:4vw;top:44vh;width:11vw;z-index:3;transform:rotate(6deg);border:2px solid var(--ink)}
.sticker{position:absolute;left:39vw;top:13vh;width:132px;height:132px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;text-align:center;transform:rotate(-12deg);z-index:4;border:2px solid var(--ink)}
.intro{position:absolute;left:40px;bottom:44px;width:30vw;z-index:4;font-size:21px;line-height:1.35;font-weight:500}
.cta{position:absolute;right:40px;bottom:44px;z-index:4;text-align:right}
.cta a{display:block;font-family:"Bricolage Grotesque";font-weight:700;font-size:34px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--ink);margin-top:10px}
.fig{position:absolute;right:7vw;top:13.5vh;z-index:4}
.rule{position:absolute;left:40px;right:40px;bottom:150px;height:2px;background:var(--ink);z-index:1}
</style>
</head>
<body>
<section class="hero">
  <nav><b>Sheroz Khan</b><span><a>Work</a><a>Services</a><a>About</a><a>Lab</a><a>Contact</a></span></nav>
  <h1 class="giant"><span>ROUGH</span><span class="two">BUILT</span></h1>
  <div class="mono fig">Fig. 01 — food-for-less.com, live</div>
  <div class="slab"><img src="../../public/shots/ffl-storefront.webp" alt=""></div>
  <img class="phone" src="../../public/shots/ffl-mobile.webp" alt="">
  <div class="sticker mono">Taking on<br>new projects</div>
  <div class="rule"></div>
  <p class="intro">Sheroz Khan is a full-stack developer and AI engineer in Dubai. Rough ideas go in. Working software comes out.</p>
  <div class="cta"><span class="mono">Full-stack · AI · creative technology</span><a>See the work ↘</a></div>
</section>
</body>
</html>
